[project]
name = "semaphore-mcp-server"
version = "0.1.2"
description = "A comprehensive MCP server for Semaphore UI integration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Vítězslav Dvořák", email = "info@vitexsoftware.cz"}
]
keywords = ["semaphore", "mcp", "ansible", "automation", "api", "server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.0.0",
    "python-semaphore-client",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/VitexSoftware/semaphore-mcp-server"
Repository = "https://github.com/VitexSoftware/semaphore-mcp-server"
Issues = "https://github.com/VitexSoftware/semaphore-mcp-server/issues"

[project.scripts]
semaphore-mcp = "semaphore_mcp.semaphore_mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["semaphore_mcp"]

[tool.setuptools.package-data]
semaphore_mcp = ["*.py"]
